<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrollment Form</title>

<style>
body {
    font-family: Arial;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    width: 70%;
    max-width: 900px;
    margin: 40px auto;
    border: 2px solid #2c3e50;   
    background: white;
    border-radius: 10px;
    overflow: hidden;
}


.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid black;
    padding: 10px;
    background: darkgray;   
    color: black;
}

.header-center {
    font-weight: bold;
    font-size: 18px;
}
.logo {
    width: 90px;   
    height: auto;
}

.body {
    display: flex;
    justify-content: space-between;
    padding: 20px;
}


.form-section {
    width: 60%;
}

.form-group {
    display: flex;
    align-items: center;
    margin: 10px 0;
}

.form-group label {
    width: 100px;
}

.form-group input {
    flex: 1;
    padding: 6px;
}

/* photo */
.photo-section {
    width: 30%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.photo-box {
    width: 140px;
    height: 140px;
    border: 2px dashed black;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* submit */
.submit-container {
    text-align: center;
    margin: 15px;
}

button {
    padding: 8px 20px;
    cursor: pointer;
    background: green;   
    color: white;          
    border: none; 
}
input {
    border: 1px solid #ccc;
    border-radius: 4px;
}

/* footer */
.footer {
    border-top: 2px solid black;
    text-align: center;
    padding: 10px;
    background:#ccc;
}
.error {
    border: 2px solid red ;
    background-color: #eee;
    }
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div>
    <img src="https://th.bing.com/th?id=OLC.x9lmxa+gIz0B2A480x360&rs=1&pid=ImgDetMain&o=7&rm=3" alt="College Logo" class="logo">
</div>
        <div class="header-center"><h1>Enrollment Form 2026-27</h1></div>
        <div id="datetime"></div>
    </div>

    <!-- BODY -->
    <div class="body">

        <!-- FORM -->
        <div class="form-section">
            <form id="myForm">

                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name">
                </div>

                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" id="age">
                </div>

                <div class="form-group">
                    <label>College:</label>
                    <input type="text" id="college">
                </div>

                <div class="form-group">
                    <label>Course:</label>
                    <input type="text" id="course">
                </div>

                <div class="form-group">
                    <label>Email_id:</label>
                    <input type="email" id="email">
                </div>

            </form>
        </div>

        <!-- PHOTO -->
        <div class="photo-section">
            <p><b>Photo</b></p>
            <div class="photo-box" id="preview">Preview</div><br>
            <input type="file" onchange="previewImage(event)">
        </div>

    </div>

    <!-- SUBMIT -->
    <div class="submit-container">
        <button type="button" onclick="submitForm()">Submit</button>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        RV Road, Basavangudi, Bengaluru-560004
    </div>

</div>

<script>
// current date and time
setInterval(() => {
    document.getElementById("datetime").innerText =
        new Date().toLocaleString();
}, 1000);

// image preview
function previewImage(event) {
    let reader = new FileReader();
    reader.onload = function () {
        document.getElementById("preview").innerHTML =
            `<img src="${reader.result}" width="100%" height="100%">`;
    }
    reader.readAsDataURL(event.target.files[0]);
}

//  submit function 
function submitForm() {
    document.querySelectorAll("input").forEach(input => {
        input.classList.remove("error");
    });
    

    let name = document.getElementById("name");
    let age = document.getElementById("age");
    let college = document.getElementById("college");
    let course = document.getElementById("course");
    let email = document.getElementById("email");

    let valid = true;

    if (name.value.trim() === "") {
        name.classList.add("error");
        valid = false;
    }

    if (age.value.trim() === "") {
        age.classList.add("error");
        valid = false;
    }

    if (college.value.trim() === "") {
        college.classList.add("error");
        valid = false;
    }

    if (course.value.trim() === "") {
        course.classList.add("error");
        valid = false;
    }

    if (email.value.trim() === "") {
        email.classList.add("error");
        valid = false;
    }

    if (!valid) {
        alert("Please fill all the fields!");
        return;
    }

    alert(
        "Submitted Details:\n\n" +
        "Name: " + name.value + "\n" +
        "Age: " + age.value + "\n" +
        "College: " + college.value + "\n" +
        "Course: " + course.value + "\n" +
        "Email: " + email.value
    );

    alert("Submitted successfully ✅");

    document.getElementById("myForm").reset();
    document.getElementById("preview").innerHTML = "Preview";

    };

</script>

</body>
</html>
